<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nirmana Gallery</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; }
        .header { background: #111; padding: 20px 30px; border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; align-items: center; gap: 20px; margin-bottom: 15px; }
        .header h1 { font-size: 1.2rem; font-weight: 500; flex: 1; }
        .folder-btn { padding: 10px 20px; background: #fff; color: #000; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 500; }
        .folder-btn:hover { background: #e0e0e0; }
        .folder-path { font-size: 0.8rem; color: #666; font-family: monospace; }
        .filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
        .filter-label { font-size: 0.7rem; color: #555; text-transform: uppercase; letter-spacing: 0.5px; margin-right: 4px; align-self: center; }
        .filter-btn { padding: 5px 12px; border: 1px solid #333; background: transparent; color: #888; border-radius: 14px; cursor: pointer; font-size: 0.75rem; }
        .filter-btn:hover { border-color: #555; color: #fff; }
        .filter-btn.active { background: #fff; color: #000; border-color: #fff; }
        .filter-btn[data-status="submitted"] { border-color: #22c55e; color: #22c55e; }
        .filter-btn[data-status="submitted"].active { background: #22c55e; color: #000; border-color: #22c55e; }
        .filter-btn[data-status="draft"] { border-color: #666; color: #666; }
        .filter-btn[data-status="draft"].active { background: #666; color: #000; border-color: #666; }
        .stats { margin-top: 8px; font-size: 0.8rem; color: #555; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; padding: 24px 30px; }
        .card { background: #141414; border-radius: 8px; overflow: hidden; transition: transform 0.15s ease; position: relative; }
        .card:hover { transform: translateY(-2px); }
        .card-badge { position: absolute; top: 8px; right: 8px; width: 10px; height: 10px; border-radius: 50%; z-index: 10; }
        .card-badge.submitted { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
        .card-badge.draft { background: #666; }
        .card-img { width: 100%; aspect-ratio: 1; object-fit: cover; cursor: pointer; background: #1a1a1a; }
        .card-info { padding: 12px; }
        .card-name { font-size: 0.8rem; color: #ccc; word-break: break-word; }
        .card-category { font-size: 0.7rem; color: #555; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .card-status-label { font-size: 0.65rem; margin-top: 6px; padding: 2px 8px; border-radius: 10px; display: inline-block; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500; }
        .card-status-label.submitted { background: #22c55e22; color: #22c55e; }
        .card-status-label.draft { background: #66666622; color: #666; }
        .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: calc(100vh - 200px); text-align: center; color: #444; }
        .empty-state h2 { font-size: 1.2rem; font-weight: 400; margin-bottom: 10px; color: #666; }
        .empty-state p { font-size: 0.85rem; margin-bottom: 20px; max-width: 400px; line-height: 1.5; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal img { max-width: 90vw; max-height: 85vh; object-fit: contain; }
        .modal-close { position: fixed; top: 20px; right: 24px; font-size: 1.5rem; color: #fff; cursor: pointer; z-index: 1001; background: rgba(0,0,0,0.5); border: none; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
        .modal-close:hover { background: rgba(255,255,255,0.2); }
        .modal-info { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 12px 20px; border-radius: 6px; text-align: center; }
        .modal-name { font-size: 0.85rem; color: #fff; }
        .modal-meta { font-size: 0.7rem; color: #666; margin-top: 4px; }
        .modal-status-btns { display: flex; gap: 8px; margin-top: 10px; justify-content: center; }
        .modal-status-btn { padding: 6px 14px; border: 1px solid #333; background: transparent; color: #888; border-radius: 16px; cursor: pointer; font-size: 0.75rem; transition: all 0.15s; }
        .modal-status-btn:hover { border-color: #555; color: #fff; }
        .modal-status-btn.active { font-weight: 500; }
        .modal-status-btn[data-status="submitted"].active { background: #22c55e; color: #000; border-color: #22c55e; }
        .modal-status-btn[data-status="draft"].active { background: #666; color: #000; border-color: #666; }
        .debug { position: fixed; bottom: 10px; right: 10px; font-size: 0.7rem; color: #333; font-family: monospace; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <h1>Nirmana Gallery</h1>
            <button class="folder-btn" id="openFolder">Open Folder</button>
        </div>
        <div class="folder-path" id="folderPath">No folder selected</div>
        <div class="filter-row" id="filterCategories"></div>
        <div class="filter-row" id="filterStatus"></div>
        <div class="stats" id="stats"></div>
    </div>

    <div class="empty-state" id="emptyState">
        <h2>No images loaded</h2>
        <p>Click "Open Folder" and select your project folder (e.g., python-design). The gallery will scan all subfolders for JPG images.</p>
        <button class="folder-btn" id="openFolderEmpty">Open Folder</button>
    </div>

    <div class="gallery" id="gallery" style="display: none;"></div>

    <div class="modal" id="modal">
        <button class="modal-close" id="modalClose">&times;</button>
        <img id="modalImg" src="" alt="">
        <div class="modal-info">
            <div class="modal-name" id="modalName"></div>
            <div class="modal-meta">4000 x 4000 px | 300 DPI</div>
            <div class="modal-status-btns" id="modalStatusBtns">
                <button class="modal-status-btn" data-status="submitted">Submitted</button>
                <button class="modal-status-btn" data-status="draft">Draft</button>
            </div>
        </div>
    </div>

    <div class="debug" id="debug"></div>

    <script>
        let allImages = [];
        let currentCategory = 'all';
        let currentStatus = 'all';
        let currentModalImg = null;

        const STORAGE_KEY = 'nirmana_gallery_status';

        const openFolderBtn = document.getElementById('openFolder');
        const openFolderEmpty = document.getElementById('openFolderEmpty');
        const folderPathEl = document.getElementById('folderPath');
        const filterCategoriesEl = document.getElementById('filterCategories');
        const filterStatusEl = document.getElementById('filterStatus');
        const statsEl = document.getElementById('stats');
        const galleryEl = document.getElementById('gallery');
        const emptyState = document.getElementById('emptyState');
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modalImg');
        const modalName = document.getElementById('modalName');
        const modalClose = document.getElementById('modalClose');
        const modalStatusBtns = document.getElementById('modalStatusBtns');
        const debugEl = document.getElementById('debug');

        function log(msg) { console.log(msg); debugEl.textContent = msg; }

        function getStatusMap() {
            try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
            catch { return {}; }
        }

        function setStatus(name, status) {
            const map = getStatusMap();
            const base = name.replace(/_\d{8}$/, '');
            map[base] = status;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(map));
        }

        function getStatus(name) {
            const map = getStatusMap();
            if (map[name]) return map[name];
            const base = name.replace(/_\d{8}$/, '');
            if (map[base]) return map[base];
            return 'draft';
        }

        function initSubmittedList() {
            const list = [
                'parallel_gradient', 'abstract_parallel_lines_gradient_angular_pattern_black_white_texture',
                'parallel_gradient_group', 'parallel_density',
                'abstract_parallel_lines_density_circle_pattern_black_white_texture', 'parallel_density_shape',
                'parallel_random', 'parallel_broken', 'abstract_parallel_lines_dashed_pattern_black_white_texture',
                'parallel_staggered', 'parallel_rhythmic', 'parallel_wave_modulated',
                'parallel_curved', 'parallel_clustered', 'abstract_parallel_lines_concentric_arc_pattern_black_white_texture',
                'abstract_parallel_lines_converging_fan_pattern_black_white_texture', 'abstract_parallel_lines_crossing_x_pattern_black_white_texture',
                'abstract_parallel_lines_symmetric_mirror_pattern_black_white_texture', 'abstract_parallel_lines_tapered_pattern_black_white_texture',
                'parallel_varying_length', 'parallel_alternating', 'abstract_parallel_lines_offset_chain_pattern_black_white_texture',
                'abstract_parallel_lines_nested_rectangle_pattern_black_white_texture', 'abstract_parallel_lines_organic_flow_pattern_black_white_texture',
                'abstract_parallel_lines_multi_layer_pattern_black_white_texture'
            ];
            const map = getStatusMap();
            let changed = false;
            for (const name of list) {
                if (!map[name]) { map[name] = 'submitted'; changed = true; }
            }
            if (changed) localStorage.setItem(STORAGE_KEY, JSON.stringify(map));
        }

        async function openFolder() {
            if ('showDirectoryPicker' in window) {
                try {
                    const dirHandle = await window.showDirectoryPicker({ mode: 'read' });
                    folderPathEl.textContent = dirHandle.name;
                    log('Scanning: ' + dirHandle.name);
                    allImages = [];
                    await scanAll(dirHandle);
                    log(`Found ${allImages.length} images`);
                    processImages();
                } catch (err) {
                    if (err.name !== 'AbortError') { log('Error: ' + err.message); console.error(err); }
                }
            } else {
                const input = document.createElement('input');
                input.type = 'file';
                input.webkitdirectory = true;
                input.multiple = true;
                input.accept = 'image/*';
                input.addEventListener('change', (e) => handleFileInput(e.target.files));
                input.click();
            }
        }

        async function scanAll(dirHandle) {
            for await (const entry of dirHandle.values()) {
                if (entry.kind === 'directory') await scanRecursive(entry, entry.name);
            }
        }

        async function scanRecursive(dirHandle, path) {
            try {
                const p = await dirHandle.requestPermission({ mode: 'read' });
                if (p !== 'granted') { log('Permission denied: ' + path); return; }
            } catch { return; }
            for await (const entry of dirHandle.values()) {
                if (entry.kind === 'directory') {
                    const newPath = path + '/' + entry.name;
                    if (entry.name === 'jpg') await scanJpgFolder(entry, path);
                    else await scanRecursive(entry, newPath);
                }
            }
        }

        async function scanJpgFolder(dirHandle, basePath) {
            try {
                const p = await dirHandle.requestPermission({ mode: 'read' });
                if (p !== 'granted') return;
            } catch { return; }
            const category = basePath.split('/').pop();
            for await (const entry of dirHandle.values()) {
                if (entry.kind === 'file' && entry.name.endsWith('.jpg')) {
                    try {
                        const file = await entry.getFile();
                        allImages.push({
                            name: entry.name.replace('.jpg', ''),
                            path: URL.createObjectURL(file),
                            category: category,
                            size: file.size
                        });
                    } catch { log('Failed: ' + entry.name); }
                }
            }
        }

        function handleFileInput(files) {
            allImages = [];
            for (const file of files) {
                if (file.name.endsWith('.jpg')) {
                    const parts = file.webkitRelativePath.split('/');
                    const catIdx = parts.findIndex(p => p === 'output');
                    allImages.push({
                        name: file.name.replace('.jpg', ''),
                        path: URL.createObjectURL(file),
                        category: catIdx > 0 ? parts[catIdx - 1] : 'unknown',
                        size: file.size
                    });
                }
            }
            processImages();
        }

        function processImages() {
            if (allImages.length === 0) {
                emptyState.style.display = 'flex';
                galleryEl.style.display = 'none';
                return;
            }
            emptyState.style.display = 'none';
            galleryEl.style.display = 'grid';

            const cats = [...new Set(allImages.map(i => i.category))].sort();
            filterCategoriesEl.innerHTML = `<span class="filter-label">Kategori</span>` +
                `<button class="filter-btn active" data-cat="all">All (${allImages.length})</button>` +
                cats.map(c => `<button class="filter-btn" data-cat="${c}">${c} (${allImages.filter(i => i.category === c).length})</button>`).join('');

            filterStatusEl.innerHTML = `<span class="filter-label">Status</span>` +
                `<button class="filter-btn active" data-status="all">All</button>` +
                `<button class="filter-btn" data-status="submitted">Submitted (${allImages.filter(i => getStatus(i.name) === 'submitted').length})</button>` +
                `<button class="filter-btn" data-status="draft">Draft (${allImages.filter(i => getStatus(i.name) === 'draft').length})</button>`;

            filterCategoriesEl.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    filterCategoriesEl.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentCategory = btn.dataset.cat;
                    renderGallery();
                });
            });

            filterStatusEl.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    filterStatusEl.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentStatus = btn.dataset.status;
                    renderGallery();
                });
            });

            renderGallery();
        }

        function renderGallery() {
            let filtered = allImages.filter(img => {
                const matchCat = currentCategory === 'all' || img.category === currentCategory;
                const matchStatus = currentStatus === 'all' || getStatus(img.name) === currentStatus;
                return matchCat && matchStatus;
            });

            filtered.sort((a, b) => {
                const sa = getStatus(a.name) === 'submitted' ? 0 : 1;
                const sb = getStatus(b.name) === 'submitted' ? 0 : 1;
                if (sa !== sb) return sa - sb;
                return a.name.localeCompare(b.name);
            });

            const sub = filtered.filter(i => getStatus(i.name) === 'submitted').length;
            const dra = filtered.filter(i => getStatus(i.name) === 'draft').length;
            statsEl.textContent = `Showing ${filtered.length} | Submitted: ${sub} | Draft: ${dra}`;

            galleryEl.innerHTML = filtered.map(img => {
                const st = getStatus(img.name);
                return `
                <div class="card">
                    <div class="card-badge ${st}"></div>
                    <img class="card-img" src="${img.path}" alt="${img.name}" loading="lazy">
                    <div class="card-info">
                        <div class="card-name">${img.name.replace(/_/g, ' ')}</div>
                        <div class="card-category">${img.category}</div>
                        <div class="card-status-label ${st}">${st}</div>
                    </div>
                </div>`;
            }).join('');

            galleryEl.querySelectorAll('.card-img').forEach((el, i) => {
                el.addEventListener('click', () => openModal(filtered[i]));
            });
        }

        function openModal(img) {
            currentModalImg = img;
            modalImg.src = img.path;
            modalName.textContent = img.name.replace(/_/g, ' ');
            updateModalStatusBtns(getStatus(img.name));
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function updateModalStatusBtns(activeStatus) {
            modalStatusBtns.querySelectorAll('.modal-status-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.status === activeStatus);
            });
        }

        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = '';
            currentModalImg = null;
        }

        modalStatusBtns.querySelectorAll('.modal-status-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (!currentModalImg) return;
                setStatus(currentModalImg.name, btn.dataset.status);
                updateModalStatusBtns(btn.dataset.status);
                renderGallery();
            });
        });

        modalClose.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

        openFolderBtn.addEventListener('click', openFolder);
        openFolderEmpty.addEventListener('click', openFolder);

        initSubmittedList();
    </script>
</body>
</html>
