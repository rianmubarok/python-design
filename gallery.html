<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nirmana Gallery</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; }
        .header { background: #111; padding: 20px 30px; border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; align-items: center; gap: 20px; margin-bottom: 15px; }
        .header h1 { font-size: 1.2rem; font-weight: 500; flex: 1; }
        .folder-btn { padding: 10px 20px; background: #fff; color: #000; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 500; }
        .folder-btn:hover { background: #e0e0e0; }
        .folder-path { font-size: 0.8rem; color: #666; font-family: monospace; }
        .filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
        .filter-label { font-size: 0.7rem; color: #555; text-transform: uppercase; letter-spacing: 0.5px; margin-right: 4px; align-self: center; }
        .filter-btn { padding: 5px 12px; border: 1px solid #333; background: transparent; color: #888; border-radius: 14px; cursor: pointer; font-size: 0.75rem; }
        .filter-btn:hover { border-color: #555; color: #fff; }
        .filter-btn.active { background: #fff; color: #000; border-color: #fff; }
        .filter-btn[data-status="real"] { border-color: #22c55e; color: #22c55e; }
        .filter-btn[data-status="real"].active { background: #22c55e; color: #000; border-color: #22c55e; }
        .filter-btn[data-status="ai"] { border-color: #f97316; color: #f97316; }
        .filter-btn[data-status="ai"].active { background: #f97316; color: #000; border-color: #f97316; }
        .filter-btn[data-status="draft"] { border-color: #666; color: #666; }
        .filter-btn[data-status="draft"].active { background: #666; color: #000; border-color: #666; }
        .stats { margin-top: 8px; font-size: 0.8rem; color: #555; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; padding: 24px 30px; }
        .card { background: #141414; border-radius: 8px; overflow: hidden; transition: transform 0.15s ease; position: relative; }
        .card:hover { transform: translateY(-2px); }
        .card-badge { position: absolute; top: 8px; right: 8px; width: 10px; height: 10px; border-radius: 50%; z-index: 10; }
        .card-badge.real { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
        .card-badge.ai { background: #f97316; box-shadow: 0 0 6px #f97316; }
        .card-badge.draft { background: #666; }
        .card-img { width: 100%; aspect-ratio: 1; object-fit: cover; cursor: pointer; background: #1a1a1a; }
        .card-info { padding: 12px; }
        .card-name { font-size: 0.8rem; color: #ccc; word-break: break-word; }
        .card-category { font-size: 0.7rem; color: #555; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .card-status-label { font-size: 0.65rem; margin-top: 6px; padding: 2px 8px; border-radius: 10px; display: inline-block; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500; }
        .card-status-label.real { background: #22c55e22; color: #22c55e; }
        .card-status-label.ai { background: #f9731622; color: #f97316; }
        .card-status-label.draft { background: #66666622; color: #666; }
        .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: calc(100vh - 200px); text-align: center; color: #444; }
        .empty-state h2 { font-size: 1.2rem; font-weight: 400; margin-bottom: 10px; color: #666; }
        .empty-state p { font-size: 0.85rem; margin-bottom: 20px; max-width: 400px; line-height: 1.5; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal img { max-width: 90vw; max-height: 85vh; object-fit: contain; }
        .modal-close { position: fixed; top: 20px; right: 24px; font-size: 1.5rem; color: #fff; cursor: pointer; z-index: 1001; background: rgba(0,0,0,0.5); border: none; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
        .modal-close:hover { background: rgba(255,255,255,0.2); }
        .modal-info { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 12px 20px; border-radius: 6px; text-align: center; }
        .modal-name { font-size: 0.85rem; color: #fff; }
        .modal-meta { font-size: 0.7rem; color: #666; margin-top: 4px; }
        .modal-status-label { font-size: 0.7rem; margin-top: 8px; padding: 3px 12px; border-radius: 12px; display: inline-block; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500; }
        .modal-status-label.real { background: #22c55e22; color: #22c55e; }
        .modal-status-label.ai { background: #f9731622; color: #f97316; }
        .modal-status-label.draft { background: #66666622; color: #666; }
        .debug { position: fixed; bottom: 10px; right: 10px; font-size: 0.7rem; color: #333; font-family: monospace; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <h1>Nirmana Gallery</h1>
            <button class="folder-btn" id="openFolder">Open Folder</button>
        </div>
        <div class="folder-path" id="folderPath">No folder selected</div>
        <div class="filter-row" id="filterCategories"></div>
        <div class="filter-row" id="filterStatus"></div>
        <div class="stats" id="stats"></div>
    </div>

    <div class="empty-state" id="emptyState">
        <h2>No images loaded</h2>
        <p>Click "Open Folder" and select your project folder (e.g., python-design). The gallery reads the master list from each category's output/jpg and gets the status from ai-detected/jpg and real-detected/jpg.</p>
        <button class="folder-btn" id="openFolderEmpty">Open Folder</button>
    </div>

    <div class="gallery" id="gallery" style="display: none;"></div>

    <div class="modal" id="modal">
        <button class="modal-close" id="modalClose">&times;</button>
        <img id="modalImg" src="" alt="">
        <div class="modal-info">
            <div class="modal-name" id="modalName"></div>
            <div class="modal-meta">4000 x 4000 px | 300 DPI</div>
            <div class="modal-status-label" id="modalStatus"></div>
        </div>
    </div>

    <div class="debug" id="debug"></div>

    <script>
        let allImages = [];
        let currentCategory = 'all';
        let currentStatus = 'all';

        // Status comes directly from the detected folders (read-only).
        const detectedSets = { real: new Set(), ai: new Set() };

        const openFolderBtn = document.getElementById('openFolder');
        const openFolderEmpty = document.getElementById('openFolderEmpty');
        const folderPathEl = document.getElementById('folderPath');
        const filterCategoriesEl = document.getElementById('filterCategories');
        const filterStatusEl = document.getElementById('filterStatus');
        const statsEl = document.getElementById('stats');
        const galleryEl = document.getElementById('gallery');
        const emptyState = document.getElementById('emptyState');
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modalImg');
        const modalName = document.getElementById('modalName');
        const modalStatus = document.getElementById('modalStatus');
        const modalClose = document.getElementById('modalClose');
        const debugEl = document.getElementById('debug');

        function log(msg) { console.log(msg); debugEl.textContent = msg; }

        // Strip a trailing date suffix, supporting both "_12092026" and " 12092026".
        function baseName(name) { return name.replace(/[_\s]\d{8}$/, ''); }

        function statusFromPath(path) {
            if (path.includes('ai-detected')) return 'ai';
            if (path.includes('real-detected')) return 'real';
            return null;
        }

        // Category = the folder right before output/ai-detected/real-detected.
        // Works whether or not the path starts with the selected root folder
        // (webkitRelativePath includes the root, the directory picker does not).
        function categoryFromPath(path) {
            const parts = path.split('/').filter(Boolean);
            const idx = parts.findIndex(p => p === 'output' || p === 'ai-detected' || p === 'real-detected');
            if (idx > 0) return parts[idx - 1];
            return parts[0] || 'unknown';
        }

        function getStatus(name) {
            const base = baseName(name);
            if (detectedSets.real.has(base)) return 'real';
            if (detectedSets.ai.has(base)) return 'ai';
            return 'draft';
        }

        async function openFolder() {
            if ('showDirectoryPicker' in window) {
                try {
                    const dirHandle = await window.showDirectoryPicker({ mode: 'read' });
                    folderPathEl.textContent = dirHandle.name;
                    log('Scanning: ' + dirHandle.name);
                    allImages = [];
                    detectedSets.real.clear();
                    detectedSets.ai.clear();
                    await scanAll(dirHandle);
                    log(`Found ${allImages.length} images`);
                    processImages();
                } catch (err) {
                    if (err.name !== 'AbortError') { log('Error: ' + err.message); console.error(err); }
                }
            } else {
                const input = document.createElement('input');
                input.type = 'file';
                input.webkitdirectory = true;
                input.multiple = true;
                input.accept = 'image/*';
                input.addEventListener('change', (e) => handleFileInput(e.target.files));
                input.click();
            }
        }

        async function canRead(dirHandle) {
            try {
                if (!dirHandle.queryPermission) return true;
                const q = await dirHandle.queryPermission({ mode: 'read' });
                if (q === 'granted') return true;
                if (q === 'denied') return false;
                if (!dirHandle.requestPermission) return true;
                const r = await dirHandle.requestPermission({ mode: 'read' });
                return r !== 'denied';
            } catch { return true; }
        }

        async function scanAll(dirHandle) {
            try {
                for await (const entry of dirHandle.values()) {
                    if (entry.kind !== 'directory') continue;
                    if (entry.name.startsWith('.')) continue;
                    try { await scanRecursive(entry, entry.name); }
                    catch (e) { log('Skip ' + entry.name + ': ' + e.message); }
                }
            } catch (e) { log('Scan error: ' + e.message); }
        }

        async function scanRecursive(dirHandle, path) {
            if (!(await canRead(dirHandle))) { log('Permission denied: ' + path); return; }
            try {
                for await (const entry of dirHandle.values()) {
                    if (entry.kind !== 'directory') continue;
                    if (entry.name.startsWith('.')) continue;
                    if (entry.name === 'jpg') {
                        const category = categoryFromPath(path);
                        const status = statusFromPath(path);
                        await scanJpgFolder(entry, category, status, status === null);
                    } else if (entry.name === 'svg' || entry.name === 'code') {
                        // no JPGs inside, skip
                    } else {
                        try { await scanRecursive(entry, path + '/' + entry.name); }
                        catch (e) { log('Skip ' + path + '/' + entry.name + ': ' + e.message); }
                    }
                }
            } catch (e) { log('Stop at ' + path + ': ' + e.message); }
        }

        async function scanJpgFolder(dirHandle, category, status, collect) {
            if (!(await canRead(dirHandle))) return;
            try {
                for await (const entry of dirHandle.values()) {
                    if (entry.kind === 'file' && entry.name.endsWith('.jpg')) {
                        try {
                            const name = entry.name.replace('.jpg', '');
                            const base = baseName(name);
                            if (status) {
                                detectedSets[status].add(base);
                            } else if (collect) {
                                const file = await entry.getFile();
                                allImages.push({
                                    name: name,
                                    path: URL.createObjectURL(file),
                                    category: category,
                                    size: file.size
                                });
                            }
                        } catch { log('Failed: ' + entry.name); }
                    }
                }
            } catch (e) { log('Stop at ' + category + '/jpg: ' + e.message); }
        }

        function handleFileInput(files) {
            allImages = [];
            detectedSets.real.clear();
            detectedSets.ai.clear();
            for (const file of files) {
                if (!file.name.endsWith('.jpg')) continue;
                const rel = file.webkitRelativePath;
                const category = categoryFromPath(rel);
                const status = statusFromPath(rel);
                const name = file.name.replace('.jpg', '');
                const base = baseName(name);
                if (status) {
                    detectedSets[status].add(base);
                } else {
                    allImages.push({
                        name: name,
                        path: URL.createObjectURL(file),
                        category: category,
                        size: file.size
                    });
                }
            }
            processImages();
        }

        function processImages() {
            if (allImages.length === 0) {
                emptyState.style.display = 'flex';
                galleryEl.style.display = 'none';
                return;
            }
            emptyState.style.display = 'none';
            galleryEl.style.display = 'grid';

            renderGallery();
        }

        function renderFilters() {
            const catMatch = i => currentStatus === 'all' || getStatus(i.name) === currentStatus;
            const cats = [...new Set(allImages.map(i => i.category))].sort();
            filterCategoriesEl.innerHTML = `<span class="filter-label">Kategori</span>` +
                `<button class="filter-btn${currentCategory === 'all' ? ' active' : ''}" data-cat="all">All (${allImages.filter(catMatch).length})</button>` +
                cats.map(c => {
                    const n = allImages.filter(i => i.category === c && catMatch(i)).length;
                    return `<button class="filter-btn${currentCategory === c ? ' active' : ''}" data-cat="${c}">${c} (${n})</button>`;
                }).join('');

            const statusMatch = i => currentCategory === 'all' || i.category === currentCategory;
            const count = s => allImages.filter(i => statusMatch(i) && getStatus(i.name) === s).length;
            filterStatusEl.innerHTML = `<span class="filter-label">Status</span>` +
                `<button class="filter-btn${currentStatus === 'all' ? ' active' : ''}" data-status="all">All (${allImages.filter(statusMatch).length})</button>` +
                `<button class="filter-btn${currentStatus === 'real' ? ' active' : ''}" data-status="real">Real (${count('real')})</button>` +
                `<button class="filter-btn${currentStatus === 'ai' ? ' active' : ''}" data-status="ai">AI (${count('ai')})</button>` +
                `<button class="filter-btn${currentStatus === 'draft' ? ' active' : ''}" data-status="draft">Draft (${count('draft')})</button>`;

            filterCategoriesEl.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => { currentCategory = btn.dataset.cat; renderGallery(); });
            });

            filterStatusEl.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => { currentStatus = btn.dataset.status; renderGallery(); });
            });
        }

        function renderGallery() {
            renderFilters();
            let filtered = allImages.filter(img => {
                const matchCat = currentCategory === 'all' || img.category === currentCategory;
                const matchStatus = currentStatus === 'all' || getStatus(img.name) === currentStatus;
                return matchCat && matchStatus;
            });

            filtered.sort((a, b) => {
                const order = { real: 0, ai: 1, draft: 2 };
                const sa = order[getStatus(a.name)] ?? 3;
                const sb = order[getStatus(b.name)] ?? 3;
                if (sa !== sb) return sa - sb;
                return a.name.localeCompare(b.name);
            });

            const real = filtered.filter(i => getStatus(i.name) === 'real').length;
            const ai = filtered.filter(i => getStatus(i.name) === 'ai').length;
            const dra = filtered.filter(i => getStatus(i.name) === 'draft').length;
            statsEl.textContent = `Showing ${filtered.length} | Real: ${real} | AI: ${ai} | Draft: ${dra}`;

            galleryEl.innerHTML = filtered.map(img => {
                const st = getStatus(img.name);
                return `
                <div class="card">
                    <div class="card-badge ${st}"></div>
                    <img class="card-img" src="${img.path}" alt="${img.name}" loading="lazy">
                    <div class="card-info">
                        <div class="card-name">${img.name.replace(/_/g, ' ')}</div>
                        <div class="card-category">${img.category}</div>
                        <div class="card-status-label ${st}">${st}</div>
                    </div>
                </div>`;
            }).join('');

            galleryEl.querySelectorAll('.card-img').forEach((el, i) => {
                el.addEventListener('click', () => openModal(filtered[i]));
            });
        }

        function openModal(img) {
            const st = getStatus(img.name);
            modalImg.src = img.path;
            modalName.textContent = img.name.replace(/_/g, ' ');
            modalStatus.className = 'modal-status-label ' + st;
            modalStatus.textContent = st;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        modalClose.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

        openFolderBtn.addEventListener('click', openFolder);
        openFolderEmpty.addEventListener('click', openFolder);
    </script>
</body>
</html>
