<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nirmana Gallery</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; }
        .header { background: #111; padding: 20px 30px; border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; align-items: center; gap: 20px; margin-bottom: 15px; }
        .header h1 { font-size: 1.2rem; font-weight: 500; flex: 1; }
        .folder-btn { padding: 10px 20px; background: #fff; color: #000; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 500; }
        .folder-btn:hover { background: #e0e0e0; }
        .folder-path { font-size: 0.8rem; color: #666; font-family: monospace; }
        .filters { display: flex; gap: 8px; flex-wrap: wrap; }
        .filter-btn { padding: 6px 14px; border: 1px solid #333; background: transparent; color: #888; border-radius: 16px; cursor: pointer; font-size: 0.8rem; }
        .filter-btn:hover { border-color: #555; color: #fff; }
        .filter-btn.active { background: #fff; color: #000; border-color: #fff; }
        .stats { margin-top: 10px; font-size: 0.8rem; color: #555; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; padding: 24px 30px; }
        .card { background: #141414; border-radius: 8px; overflow: hidden; transition: transform 0.15s ease; }
        .card:hover { transform: translateY(-2px); }
        .card-img { width: 100%; aspect-ratio: 1; object-fit: cover; cursor: pointer; background: #1a1a1a; }
        .card-info { padding: 12px; }
        .card-name { font-size: 0.8rem; color: #ccc; word-break: break-word; }
        .card-category { font-size: 0.7rem; color: #555; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: calc(100vh - 200px); text-align: center; color: #444; }
        .empty-state h2 { font-size: 1.2rem; font-weight: 400; margin-bottom: 10px; color: #666; }
        .empty-state p { font-size: 0.85rem; margin-bottom: 20px; max-width: 400px; line-height: 1.5; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal img { max-width: 90vw; max-height: 90vh; object-fit: contain; }
        .modal-close { position: fixed; top: 20px; right: 24px; font-size: 1.5rem; color: #fff; cursor: pointer; z-index: 1001; background: rgba(0,0,0,0.5); border: none; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
        .modal-close:hover { background: rgba(255,255,255,0.2); }
        .modal-info { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 12px 20px; border-radius: 6px; text-align: center; }
        .modal-name { font-size: 0.85rem; color: #fff; }
        .modal-meta { font-size: 0.7rem; color: #666; margin-top: 4px; }
        .debug { position: fixed; bottom: 10px; right: 10px; font-size: 0.7rem; color: #333; font-family: monospace; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <h1>Nirmana Gallery</h1>
            <button class="folder-btn" id="openFolder">Open Folder</button>
        </div>
        <div class="folder-path" id="folderPath">No folder selected</div>
        <div class="filters" id="filters"></div>
        <div class="stats" id="stats"></div>
    </div>

    <div class="empty-state" id="emptyState">
        <h2>No images loaded</h2>
        <p>Click "Open Folder" and select your project folder (e.g., python-design). The gallery will scan all subfolders for JPG images.</p>
        <button class="folder-btn" id="openFolderEmpty">Open Folder</button>
    </div>

    <div class="gallery" id="gallery" style="display: none;"></div>

    <div class="modal" id="modal">
        <button class="modal-close" id="modalClose">&times;</button>
        <img id="modalImg" src="" alt="">
        <div class="modal-info">
            <div class="modal-name" id="modalName"></div>
            <div class="modal-meta">4000 x 4000 px | 300 DPI</div>
        </div>
    </div>

    <div class="debug" id="debug"></div>

    <script>
        let allImages = [];
        let currentFilter = 'all';

        const openFolderBtn = document.getElementById('openFolder');
        const openFolderEmpty = document.getElementById('openFolderEmpty');
        const folderPathEl = document.getElementById('folderPath');
        const filtersEl = document.getElementById('filters');
        const statsEl = document.getElementById('stats');
        const galleryEl = document.getElementById('gallery');
        const emptyState = document.getElementById('emptyState');
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modalImg');
        const modalName = document.getElementById('modalName');
        const modalClose = document.getElementById('modalClose');
        const debugEl = document.getElementById('debug');

        function log(msg) {
            console.log(msg);
            debugEl.textContent = msg;
        }

        async function openFolder() {
            if ('showDirectoryPicker' in window) {
                try {
                    const dirHandle = await window.showDirectoryPicker({ mode: 'read' });
                    folderPathEl.textContent = dirHandle.name;
                    log('Scanning: ' + dirHandle.name);
                    allImages = [];
                    await scanAll(dirHandle);
                    log(`Found ${allImages.length} images`);
                    processImages();
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        log('Error: ' + err.message);
                        console.error(err);
                    }
                }
            } else {
                const input = document.createElement('input');
                input.type = 'file';
                input.webkitdirectory = true;
                input.multiple = true;
                input.accept = 'image/*';
                input.addEventListener('change', (e) => handleFileInput(e.target.files));
                input.click();
            }
        }

        async function scanAll(dirHandle) {
            for await (const entry of dirHandle.values()) {
                if (entry.kind === 'directory') {
                    await scanRecursive(entry, entry.name);
                }
            }
        }

        async function scanRecursive(dirHandle, path) {
            try {
                const permission = await dirHandle.requestPermission({ mode: 'read' });
                if (permission !== 'granted') {
                    log('Permission denied: ' + path);
                    return;
                }
            } catch (e) {
                return;
            }

            for await (const entry of dirHandle.values()) {
                if (entry.kind === 'directory') {
                    const newPath = path + '/' + entry.name;
                    if (entry.name === 'jpg') {
                        await scanJpgFolder(entry, path);
                    } else {
                        await scanRecursive(entry, newPath);
                    }
                }
            }
        }

        async function scanJpgFolder(dirHandle, basePath) {
            try {
                const permission = await dirHandle.requestPermission({ mode: 'read' });
                if (permission !== 'granted') return;
            } catch (e) {
                return;
            }

            const category = basePath.split('/').pop();
            for await (const entry of dirHandle.values()) {
                if (entry.kind === 'file' && entry.name.endsWith('.jpg')) {
                    try {
                        const file = await entry.getFile();
                        const url = URL.createObjectURL(file);
                        allImages.push({
                            name: entry.name.replace('.jpg', ''),
                            path: url,
                            category: category,
                            size: file.size
                        });
                    } catch (e) {
                        log('Failed to read: ' + entry.name);
                    }
                }
            }
        }

        function handleFileInput(files) {
            allImages = [];
            for (const file of files) {
                if (file.name.endsWith('.jpg')) {
                    const parts = file.webkitRelativePath.split('/');
                    const catIdx = parts.findIndex(p => p === 'output');
                    const category = catIdx > 0 ? parts[catIdx - 1] : 'unknown';
                    allImages.push({
                        name: file.name.replace('.jpg', ''),
                        path: URL.createObjectURL(file),
                        category: category,
                        size: file.size
                    });
                }
            }
            processImages();
        }

        function processImages() {
            if (allImages.length === 0) {
                emptyState.style.display = 'flex';
                galleryEl.style.display = 'none';
                return;
            }

            emptyState.style.display = 'none';
            galleryEl.style.display = 'grid';

            const categories = [...new Set(allImages.map(i => i.category))].sort();
            filtersEl.innerHTML = `<button class="filter-btn active" data-filter="all">All (${allImages.length})</button>` +
                categories.map(c => {
                    const count = allImages.filter(i => i.category === c).length;
                    return `<button class="filter-btn" data-filter="${c}">${c} (${count})</button>`;
                }).join('');

            filtersEl.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    filtersEl.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    renderGallery();
                });
            });

            renderGallery();
        }

        function renderGallery() {
            const filtered = currentFilter === 'all' ? allImages : allImages.filter(i => i.category === currentFilter);
            statsEl.textContent = `Showing ${filtered.length} images`;

            galleryEl.innerHTML = filtered.map(img => `
                <div class="card">
                    <img class="card-img" src="${img.path}" alt="${img.name}" loading="lazy">
                    <div class="card-info">
                        <div class="card-name">${img.name.replace(/_/g, ' ')}</div>
                        <div class="card-category">${img.category}</div>
                    </div>
                </div>
            `).join('');

            galleryEl.querySelectorAll('.card-img').forEach((el, i) => {
                el.addEventListener('click', () => openModal(filtered[i]));
            });
        }

        function openModal(img) {
            modalImg.src = img.path;
            modalName.textContent = img.name.replace(/_/g, ' ');
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        modalClose.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

        openFolderBtn.addEventListener('click', openFolder);
        openFolderEmpty.addEventListener('click', openFolder);
    </script>
</body>
</html>
